<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>九龍工業學校65周年校慶 - 答問遊戲</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0c1a30;
      --card: #152642;
      --gold: #f2c94c;
      --btn-a: #eb5757;
      --btn-b: #2f80ed;
      --btn-c: #f2994a;
      --btn-d: #27ae60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #081220; padding: 12px; text-align: center; border-bottom: 2px solid var(--gold); }
    header h1 { font-size: 1.05rem; color: var(--gold); }
    header p { font-size: 0.8rem; opacity: 0.8; }
    .container { flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: center; }
    
    /* 登入表單 */
    .form-box { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .input-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    button.btn-primary { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; color: #081220; }

    /* 答題區域 - 新增題目與選項文字排版 */
    .status-bar { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 15px; background: var(--card); padding: 10px 14px; border-radius: 8px; }
    .wait-box { text-align: center; padding: 40px 10px; }
    .wait-box h2 { color: var(--gold); margin-bottom: 10px; }
    
    .question-display { background: rgba(255,255,255,0.08); padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 1.15rem; font-weight: bold; line-height: 1.4; color: var(--gold); border-left: 4px solid var(--gold); }
    
    .choice-stack { display: flex; flex-direction: column; gap: 12px; }
    .choice-btn { border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; color: white; display: flex; align-items: center; padding: 12px 15px; cursor: pointer; transition: transform 0.1s; text-align: left; line-height: 1.3; }
    .choice-btn:active { transform: scale(0.98); }
    
    .opt-label { font-size: 1.4rem; margin-right: 15px; background: rgba(0,0,0,0.2); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
    .opt-text { flex: 1; }

    .btn-A { background: var(--btn-a); }
    .btn-B { background: var(--btn-b); }
    .btn-C { background: var(--btn-c); }
    .btn-D { background: var(--btn-d); }
    .choice-btn.selected { outline: 4px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.5); transform: scale(1.02); }
    .choice-btn:disabled { opacity: 0.6; filter: grayscale(40%); cursor: not-allowed; transform: none; }

    /* 結果回饋 */
    .feedback-box { text-align: center; padding: 25px; border-radius: 12px; background: var(--card); }
    .feedback-box.correct { border: 2px solid var(--btn-d); }
    .feedback-box.wrong { border: 2px solid var(--btn-a); }
  </style>
</head>
<body>
  <header>
    <h1>九龍工業學校 65 周年校慶晚宴</h1>
    <p>校友問答爭霸戰</p>
  </header>

  <div class="container">
    <!-- 1. 登記區 -->
    <div id="regView" class="form-box">
      <h3 style="margin-bottom: 15px; text-align:center;">參加者登記</h3>
      <div class="input-group">
        <label>你的姓名</label>
        <input type="text" id="name" placeholder="如：陳大文">
      </div>
      <div class="input-group">
        <label>畢業年份</label>
        <input type="number" id="gradYear" placeholder="如：1998">
      </div>
      <div class="input-group">
        <label>當前枱號</label>
        <input type="text" id="tableNo" placeholder="如：12">
      </div>
      <button class="btn-primary" onclick="handleRegister()">進入遊戲</button>
    </div>

    <!-- 2. 遊戲主畫面 -->
    <div id="gameView" style="display:none; flex-direction:column; flex:1;">
      <div class="status-bar">
        <span id="userInfo">--</span>
        <span id="userScore">得分：0 分</span>
      </div>

      <div id="contentArea" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
        <!-- 動態置換內容 -->
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let selectedChoice = null;

    // 檢查本地登入狀態
    window.onload = () => {
      const saved = localStorage.getItem('kts_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        socket.emit('register', currentUser, (res) => {
          if (res.success) {
            currentUser = res.user;
            showGame();
          }
        });
      }
    };

    function handleRegister() {
      const name = document.getElementById('name').value.trim();
      const gradYear = document.getElementById('gradYear').value.trim();
      const tableNo = document.getElementById('tableNo').value.trim();
      if (!name || !gradYear || !tableNo) return alert('請填寫完整資訊！');

      const userId = 'u_' + Math.random().toString(36).substr(2, 9);
      const data = { userId, name, gradYear, tableNo };

      socket.emit('register', data, (res) => {
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('kts_user', JSON.stringify(currentUser));
          showGame();
        } else {
          alert(res.message);
        }
      });
    }

    function showGame() {
      document.getElementById('regView').style.display = 'none';
      const gameView = document.getElementById('gameView');
      gameView.style.display = 'flex';
      document.getElementById('userInfo').innerText = `${currentUser.name} (${currentUser.tableNo}號枱)`;
      document.getElementById('userScore').innerText = `得分：${currentUser.score} 分`;
    }

    function selectOption(opt) {
      selectedChoice = opt;
      if (navigator.vibrate) navigator.vibrate(40);
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById(`btn_${opt}`).classList.add('selected');
      socket.emit('submit_answer', opt);
    }

    // 監聽伺服器廣播
    socket.on('state_update', (data) => {
      const area = document.getElementById('contentArea');
      if (document.getElementById('userScore') && currentUser) {
        document.getElementById('userScore').innerText = `得分：${currentUser.score} 分`;
      }

      if (data.state === 'IDLE') {
        area.innerHTML = `<div class="wait-box"><h2>即將開始</h2><p>請留意大螢幕，遊戲即將展開！</p></div>`;
      
      } else if (data.state === 'PREVIEW' || data.state === 'OPEN' || data.state === 'COUNTDOWN') {
        const q = data.currentQuestion;
        const isPreview = (data.state === 'PREVIEW');
        
        // 渲染題目與選項文字
        let html = `
          <div class="question-display">
            Q${q.index}. ${q.question}
          </div>
          <div class="choice-stack">
        `;
        
        ['A', 'B', 'C', 'D'].forEach(opt => {
          html += `
            <button id="btn_${opt}" class="choice-btn btn-${opt}" onclick="selectOption('${opt}')" ${isPreview ? 'disabled' : ''}>
              <span class="opt-label">${opt}</span>
              <span class="opt-text">${q.options[opt]}</span>
            </button>
          `;
        });
        
        html += `</div>`;
        
        if (isPreview) {
          selectedChoice = null; // 預覽階段重置選擇
          html += `<p style="text-align:center; margin-top:15px; font-size:1rem; color:var(--gold);">準備中... 即將開放作答</p>`;
        } else {
          html += `<p style="text-align:center; margin-top:15px; font-size:0.85rem; opacity:0.8;">點擊按鈕即可作答，倒數前可隨時更改</p>`;
        }

        area.innerHTML = html;
        
        // 恢復已選選項（防斷線或狀態更新）
        if (selectedChoice && !isPreview) {
          document.getElementById(`btn_${selectedChoice}`).classList.add('selected');
        }

      }
    });

    socket.on('start_countdown_timer', (sec) => {
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    });

    socket.on('reveal_result', (data) => {
      const area = document.getElementById('contentArea');
      const isCorrect = selectedChoice === data.correct;
      if (isCorrect) {
        currentUser.score += 10;
        document.getElementById('userScore').innerText = `得分：${currentUser.score} 分`;
      }
      
      area.innerHTML = `
        <div class="feedback-box ${isCorrect ? 'correct' : 'wrong'}">
          <h2 style="font-size:2rem; margin-bottom:10px;">${isCorrect ? '🎉 答對了！' : '❌ 答錯了！'}</h2>
          <p style="font-size:1.2rem;">正確答案是：<b style="color:var(--gold); font-size:1.5rem;">${data.correct}</b></p>
          <p style="margin-top:12px; opacity:0.8;">你選擇了：${selectedChoice || '未作答'}</p>
          <p style="margin-top:5px; font-weight:bold; color:${isCorrect ? '#27ae60':'#eb5757'};">${isCorrect ? '+10 分' : '+0 分'}</p>
        </div>
      `;
    });

    socket.on('show_leaderboard_data', () => {
      const area = document.getElementById('contentArea');
      area.innerHTML = `<div class="wait-box"><h2>🏆 答題結束</h2><p>請留意大螢幕公佈最終得獎名單！</p></div>`;
    });
  </script>
</body>
</html>
